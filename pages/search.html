<!doctype html>
<html lang="en" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search templates | Templora</title>
  <meta name="description" content="Search website templates by name, category, technology or use case.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <!-- SEO integration point: WordPress (Yoast / Rank Math) outputs the canonical URL here. -->
  <meta property="og:site_name" content="Templora">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Search templates | Templora">
  <meta property="og:description" content="Search website templates by name, category, technology or use case.">
  <meta property="og:image" content="../assets/images/ui/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="../css/tailwind.css">
  <link rel="stylesheet" href="../css/design-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/custom.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script defer src="../js/data.js"></script>
  <script defer src="../js/icons.js"></script>
  <script defer src="../js/app.js"></script>
  <script defer src="../js/wishlist.js"></script>
  <script defer src="../js/cart.js"></script>
  <script defer src="../js/forms.js"></script>
  <script defer src="../js/search.js"></script>
  <script defer src="../js/animations.js"></script>
  <script defer src="../js/filters.js"></script>
  <script defer src="../js/pages/search.js"></script>
</head>
<body data-page="search">
  <div data-include="header"></div>
  <main id="main" tabindex="-1">
    <header class="page-header">
      <div class="container">
        <div data-breadcrumbs></div>
        <h1 class="page-header__title" data-title>Search templates</h1>
        <form class="search-field search-field--lg" role="search" style="margin-top:20px;max-width:720px" data-page-search>
          <label class="sr-only" for="search-q">Search templates</label>
          <span class="search-field__icon"><span data-icon="search"></span></span>
          <input class="search-field__input" id="search-q" type="search" name="q" placeholder="Search website templates..." autocomplete="off" data-local-search enterkeyhint="search">
          <button class="btn btn--primary search-field__submit" type="submit">Search</button>
        </form>
        <div class="hero__popular" style="margin-top:14px"><span class="text-muted" id="related-label">Related searches:</span><ul class="chip-row" aria-labelledby="related-label" data-related style="list-style:none;margin:0;padding:0"></ul></div>
        <p class="hint" style="margin-top:12px">Prototype search matches names, categories, technologies and tags in the sample catalogue only.</p>
      </div>
    </header>
    <section class="section section--tight" aria-label="Search results">
      <div class="container" data-search-root>
        <div data-category-note></div>
        <div class="listing" data-listing>
          <aside class="filters-panel" id="filters-panel" aria-labelledby="filters-title">
            <div class="filters-panel__head"><h2 class="filters__title" id="filters-title-m">Filters</h2><button type="button" class="icon-btn" data-close-filters aria-label="Close filters"><span data-icon="x"></span></button></div>
            <div class="filters">
              <div class="filters__head"><h2 class="filters__title" id="filters-title">Filters</h2><button type="button" class="btn btn--ghost btn--sm" data-filters-clear>Clear all</button></div>
              <div data-filters></div>
            </div>
            <div class="filters-panel__foot"><button type="button" class="btn" data-filters-clear>Clear all</button><button type="button" class="btn btn--primary" data-filters-apply>Show results</button></div>
          </aside>
          <div>
            <div class="toolbar">
              <p class="toolbar__count"><strong data-count>0</strong> templates</p>
              <div class="toolbar__right">
                <button type="button" class="btn hide-desktop" data-open-filters aria-controls="filters-panel" aria-expanded="false"><span data-icon="sliders"></span>Filters <span class="badge badge--new" data-active-count hidden></span></button>
                <label class="sr-only" for="sort">Sort by</label>
                <select class="select" id="sort" data-sort></select>
              </div>
            </div>
            <div class="active-filters" data-active-filters aria-label="Active filters"></div>
            <p class="sr-only" aria-live="polite" data-results-status></p>
            <div class="product-grid product-grid--3" data-results aria-busy="true"></div>
            <div data-pagination></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div data-include="footer"></div>
  <noscript><p style="padding:16px;text-align:center">This prototype needs JavaScript for search, cart and dashboards. Product content will be server-rendered in the WordPress build.</p></noscript>
</body>
</html>
