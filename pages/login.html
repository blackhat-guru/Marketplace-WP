<!doctype html>
<html lang="en" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Templora</title>
  <meta name="description" content="Log in to your Templora account to access purchases, downloads and your seller dashboard.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <!-- SEO integration point: WordPress (Yoast / Rank Math) outputs the canonical URL here. -->
  <meta property="og:site_name" content="Templora">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Log in | Templora">
  <meta property="og:description" content="Log in to your Templora account to access purchases, downloads and your seller dashboard.">
  <meta property="og:image" content="../assets/images/ui/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="../css/tailwind.css">
  <link rel="stylesheet" href="../css/design-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/custom.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script defer src="../js/data.js"></script>
  <script defer src="../js/icons.js"></script>
  <script defer src="../js/app.js"></script>
  <script defer src="../js/wishlist.js"></script>
  <script defer src="../js/cart.js"></script>
  <script defer src="../js/forms.js"></script>
  <script defer src="../js/search.js"></script>
  <script defer src="../js/animations.js"></script>
  <script defer src="../js/pages/auth.js"></script>
</head>
<body data-page="auth" data-no-announcement>
  <div data-include="header"></div>
  <main id="main" tabindex="-1" class="auth" data-auth="login">
    <div class="auth__panel"><div class="auth__card" data-auth-card aria-live="polite"></div></div>
    <aside class="auth__aside" aria-label="About Templora">
      <div><p class="eyebrow" style="color:#9fb2ff">One account for buying and selling</p><p style="font-size:1.75rem;font-weight:600;line-height:1.25;margin-top:12px;max-width:22ch">Preview every page. Read the license. Then build.</p></div>
      <div class="auth__aside-art" aria-hidden="true"><img src="../assets/images/products/agencypro-desktop.svg" alt="" width="1440" height="900"><img src="../assets/images/products/edunova-desktop.svg" alt="" width="1440" height="900"><img src="../assets/images/products/savora-desktop.svg" alt="" width="1440" height="900"><img src="../assets/images/products/clouddesk-desktop.svg" alt="" width="1440" height="900"></div>
      <p style="color:var(--color-text-inverse-muted);font-size:var(--text-meta)">Authentication is simulated in this prototype — no account data leaves your browser.</p>
    </aside>
  </main>
  <div data-include="footer"></div>
  <noscript><p style="padding:16px;text-align:center">This prototype needs JavaScript for search, cart and dashboards. Product content will be server-rendered in the WordPress build.</p></noscript>
</body>
</html>
