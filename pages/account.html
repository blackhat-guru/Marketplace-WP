<!doctype html>
<html lang="en" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My account | Templora</title>
  <meta name="description" content="Manage your orders, downloads, wishlist, reviews and profile.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <!-- SEO integration point: WordPress (Yoast / Rank Math) outputs the canonical URL here. -->
  <meta property="og:site_name" content="Templora">
  <meta property="og:type" content="website">
  <meta property="og:title" content="My account | Templora">
  <meta property="og:description" content="Manage your orders, downloads, wishlist, reviews and profile.">
  <meta property="og:image" content="../assets/images/ui/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="../css/tailwind.css">
  <link rel="stylesheet" href="../css/design-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/custom.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script defer src="../js/data.js"></script>
  <script defer src="../js/icons.js"></script>
  <script defer src="../js/app.js"></script>
  <script defer src="../js/wishlist.js"></script>
  <script defer src="../js/cart.js"></script>
  <script defer src="../js/forms.js"></script>
  <script defer src="../js/search.js"></script>
  <script defer src="../js/animations.js"></script>
  <script defer src="../js/dashboard.js"></script>
  <script defer src="../js/pages/account.js"></script>
</head>
<body data-page="account" data-no-announcement>
  <div data-include="header"></div>
  <main id="main" tabindex="-1">
    <div class="app-shell">
      <aside class="app-sidebar" aria-label="Account">
        <div class="app-sidebar__inner">
          <div class="profile-chip app-sidebar__profile" data-profile-chip></div>
          <nav aria-label="Account sections">
            <ul class="app-nav">
              <li><a class="app-nav__link" href="#overview"><span data-icon="home"></span>Overview</a></li>
              <li><a class="app-nav__link" href="#orders"><span data-icon="receipt"></span>My orders</a></li>
              <li><a class="app-nav__link" href="#downloads"><span data-icon="download"></span>My downloads</a></li>
              <li><a class="app-nav__link" href="#wishlist"><span data-icon="heart"></span>Wishlist <span class="app-nav__badge" data-wishlist-count-text>0</span></a></li>
              <li><a class="app-nav__link" href="#reviews"><span data-icon="star"></span>Reviews</a></li>
              <li><a class="app-nav__link" href="#support"><span data-icon="help"></span>Support requests</a></li>
              <li><a class="app-nav__link" href="#profile"><span data-icon="settings"></span>Profile settings</a></li>
            </ul>
          </nav>
          <div class="app-sidebar__extra" style="margin-top:24px;padding:16px;border-radius:12px;background:#fff;border:1px solid var(--color-border)" data-seller-promo></div>
        </div>
      </aside>
      <div class="app-main">
        <div data-demo-banner></div>
        <section data-section="overview" aria-labelledby="h-overview"></section>
        <section data-section="orders" aria-labelledby="h-orders" hidden></section>
        <section data-section="downloads" aria-labelledby="h-downloads" hidden></section>
        <section data-section="wishlist" aria-labelledby="h-wishlist" hidden></section>
        <section data-section="reviews" aria-labelledby="h-reviews" hidden></section>
        <section data-section="support" aria-labelledby="h-support" hidden></section>
        <section data-section="profile" aria-labelledby="h-profile" hidden></section>
      </div>
    </div>
  </main>
  <div data-include="footer"></div>
  <noscript><p style="padding:16px;text-align:center">This prototype needs JavaScript for search, cart and dashboards. Product content will be server-rendered in the WordPress build.</p></noscript>
</body>
</html>
