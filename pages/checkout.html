<!doctype html>
<html lang="en" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | Templora</title>
  <meta name="description" content="Complete your template purchase.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <!-- SEO integration point: WordPress (Yoast / Rank Math) outputs the canonical URL here. -->
  <meta property="og:site_name" content="Templora">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Checkout | Templora">
  <meta property="og:description" content="Complete your template purchase.">
  <meta property="og:image" content="../assets/images/ui/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="../css/tailwind.css">
  <link rel="stylesheet" href="../css/design-tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/custom.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script defer src="../js/data.js"></script>
  <script defer src="../js/icons.js"></script>
  <script defer src="../js/app.js"></script>
  <script defer src="../js/wishlist.js"></script>
  <script defer src="../js/cart.js"></script>
  <script defer src="../js/forms.js"></script>
  <script defer src="../js/search.js"></script>
  <script defer src="../js/animations.js"></script>
  <script defer src="../js/pages/checkout.js"></script>
</head>
<body data-page="checkout" data-no-announcement>
  <div data-include="header"></div>
  <main id="main" tabindex="-1">
    <section class="section section--tight">
      <div class="container">
        <div data-breadcrumbs></div>
        <h1 class="page-header__title" style="margin-bottom:20px">Checkout</h1>
        <ol class="steps checkout-steps" aria-label="Checkout progress">
          <li class="steps__item is-done"><a href="cart.html">1. Cart</a><span class="sr-only"> (completed)</span></li>
          <li class="steps__item is-current" aria-current="step">2. Details &amp; payment</li>
          <li class="steps__item">3. Confirmation</li>
        </ol>
        <div data-checkout-root></div>
      </div>
    </section>
  </main>
  <div data-include="footer"></div>
  <noscript><p style="padding:16px;text-align:center">This prototype needs JavaScript for search, cart and dashboards. Product content will be server-rendered in the WordPress build.</p></noscript>
</body>
</html>
